<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProtoSem Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background-color: #f9fafb; color: #111827; }
    .hidden { display: none !important; }
  </style>
</head>
<body class="antialiased min-h-screen">
  
  <!-- LOGIN SCREEN -->
  <div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-xl shadow-lg max-w-md w-full space-y-6">
      <div class="space-y-2 text-center">
        <h1 class="text-2xl font-bold text-gray-900">ProtoSem Admin</h1>
        <p class="text-sm text-gray-500">Secure owner access via GitHub Token</p>
      </div>
      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">GitHub Personal Access Token</label>
          <input type="password" id="gh-token" required class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-purple-500 focus:outline-none" placeholder="ghp_...">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Repository Name</label>
          <input type="text" id="gh-repo" required class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-purple-500 focus:outline-none" value="mithradharshini/mithradharshini.github.io" placeholder="owner/repo">
        </div>
        <button type="submit" class="w-full bg-purple-900 text-white font-medium py-2 rounded-lg hover:bg-purple-800 transition-colors">
          Authenticate
        </button>
        <p id="login-error" class="text-red-500 text-sm text-center hidden"></p>
      </form>
    </div>
  </div>

  <!-- DASHBOARD SCREEN -->
  <div id="dashboard-screen" class="hidden min-h-screen flex flex-col">
    <header class="bg-purple-900 text-white p-4 shadow-md">
      <div class="max-w-6xl mx-auto flex justify-between items-center">
        <h1 class="text-xl font-bold flex items-center gap-2"><i data-lucide="shield-check"></i> ProtoSem Secure Admin</h1>
        <button id="logout-btn" class="text-purple-200 hover:text-white text-sm font-medium">Logout</button>
      </div>
    </header>
    
    <main class="flex-grow max-w-6xl mx-auto w-full p-4 sm:p-6 grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <!-- Week List -->
      <div class="md:col-span-1 bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col h-[80vh]">
        <div class="p-4 border-b border-gray-200 bg-gray-50">
          <h2 class="font-semibold text-gray-800">20-Week Timeline</h2>
        </div>
        <div id="week-list" class="overflow-y-auto flex-grow p-2 space-y-1">
          <!-- Populated by JS -->
        </div>
      </div>

      <!-- Editor -->
      <div class="md:col-span-2 bg-white rounded-xl shadow-sm border border-gray-200 h-[80vh] flex flex-col">
        
        <div id="editor-empty" class="flex-grow flex flex-col items-center justify-center text-gray-400 p-8 text-center">
          <i data-lucide="edit-3" class="w-12 h-12 mb-3 text-gray-300"></i>
          <p>Select a week from the sidebar to edit content.</p>
        </div>

        <div id="editor-active" class="hidden flex-col h-full">
          <div class="p-4 border-b border-gray-200 flex justify-between items-center bg-gray-50">
            <h2 id="editor-header" class="font-semibold text-gray-800 text-lg">Editing Week 00</h2>
            <div class="flex items-center gap-2">
              <span id="save-status" class="text-sm text-gray-500 hidden">Saving...</span>
              <button id="save-btn" class="bg-purple-900 text-white px-4 py-1.5 rounded-lg text-sm font-medium hover:bg-purple-800 transition-colors flex items-center gap-2">
                <i data-lucide="upload-cloud" class="w-4 h-4"></i> Publish to GitHub
              </button>
            </div>
          </div>
          
          <div class="flex-grow overflow-y-auto p-6 space-y-6">
            <div class="space-y-1">
              <label class="block text-sm font-medium text-gray-700">Week Title</label>
              <input type="text" id="edit-title" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-purple-500 focus:outline-none">
            </div>

            <div class="space-y-1">
              <label class="block text-sm font-medium text-gray-700">Detailed Description / Notes</label>
              <textarea id="edit-desc" rows="10" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-purple-500 focus:outline-none font-mono text-sm"></textarea>
            </div>

            <div class="space-y-3">
              <div class="flex justify-between items-center">
                <label class="block text-sm font-medium text-gray-700">Gallery Images</label>
                <label class="cursor-pointer bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg text-xs font-medium transition-colors flex items-center gap-1">
                  <i data-lucide="image-plus" class="w-3.5 h-3.5"></i> Add Image
                  <input type="file" id="add-image-input" accept="image/*" class="hidden">
                </label>
              </div>
              <div id="image-gallery-editor" class="grid grid-cols-2 gap-4">
                <!-- Populated by JS -->
              </div>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="admin.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
